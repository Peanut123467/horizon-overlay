[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-overlay"
version = "0.2.0"
description = "A click-through Windows overlay for players who get motion discomfort in 3D games. No injection, no game files, no telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Peanut123467", email = "2446484145@qq.com" }]
keywords = ["motion-sickness", "comfort", "overlay", "accessibility", "gaming", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pystray>=0.19",
    "pywebview>=6.2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
horizon = "horizon.__main__:main"

# GUI entry point: launching this does NOT open a console window, which is what
# you want for a tray-resident app. Installed as horizonw.exe on Windows.
[project.gui-scripts]
horizonw = "horizon.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
horizon = ["console/ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
